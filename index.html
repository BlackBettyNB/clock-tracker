  <style>

    input,button,select,textarea{font-family:inherit}
    ::-webkit-scrollbar{display:none}
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1)}
    .mono{font-family:'SF Mono','Fira Mono',monospace}
    .stats-bar{background:#1a1d23;border-bottom:1px solid #2a2d35;padding:12px 16px;flex-shrink:0}
    .stats-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .stat-cards{display:flex;gap:8px}
    .stat-card{background:#252830;border-radius:8px;padding:7px 10px;flex:1;text-align:center}
    .stat-lbl{font-size:10px;color:#6b7080;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
    .stat-val{font-size:14px;font-weight:700;color:#22c55e}
    .main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .section{padding:16px}
    .card{background:#1a1d23;border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid #2a2d35}
    .btn{padding:11px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
    .clock-btn{width:100%;padding:20px;border:none;border-radius:12px;font-size:20px;font-weight:800;cursor:pointer;letter-spacing:.02em;margin-bottom:12px}
    .nav{background:#1a1d23;border-top:1px solid #2a2d35;display:flex;flex-shrink:0}
    .nav-btn{flex:1;padding:12px 0 10px;border:none;background:transparent;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;color:#6b7080}
    .nav-btn.active{color:#4a9eff;border-top-color:#4a9eff;font-weight:700}
    .nav-icon{font-size:20px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .cal-day{width:100%;aspect-ratio:1;border:none;border-radius:8px;cursor:pointer;font-size:13px;background:#1e2028;color:#4b5060;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .cal-day.has-entry{color:#e8eaed}
    .cal-day.is-today{color:#4a9eff;font-weight:700;outline:1px solid #4a9eff44}
    .cal-day.sel{background:#4a9eff!important;color:#fff!important;outline:none}
    .cal-day.regular{background:#22c55e18}.cal-day.overtime{background:#f9731622}.cal-day.holiday{background:#a78bfa22}.cal-day.halfholiday{background:#c084fc22}.cal-day.sickness{background:#38bdf822}
    .cal-dot{width:5px;height:5px;border-radius:50%}
    .badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;color:#fff}
    .input{background:#252830;border:1px solid #3a3d45;border-radius:8px;padding:10px 12px;color:#e8eaed;font-size:15px;width:100%;display:block}
    textarea.input{resize:none;font-size:11px;line-height:1.5;height:200px}
    .overlay{position:fixed;inset:0;background:#000c;z-index:200;display:flex;align-items:flex-end;justify-content:center}
    .sheet{background:#1a1d23;border-radius:18px 18px 0 0;padding:24px;width:100%;max-width:480px;max-height:85dvh;overflow-y:auto;border:1px solid #2a2d35}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#4a9eff;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;z-index:300;box-shadow:0 4px 20px #0008;white-space:nowrap;pointer-events:none}
    .row{display:flex;gap:8px}.row-between{display:flex;justify-content:space-between;align-items:center}
    .lbl{font-size:10px;color:#6b7080;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
    .text-muted{color:#8b8f98;font-size:14px}.text-green{color:#22c55e}
    .sec-title{font-size:12px;font-weight:700;color:#6b7080;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  </style>
</head>

function load(){try{var r=localStorage.getItem(SK);if(r){var d=JSON.parse(r);d.settings=Object.assign({},DEF_S,d.settings);return d;}}catch(e){}return{entries:Object.assign({},SEED),settings:Object.assign({},DEF_S)};}
function persist(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}}
function save(d,skip){D=d;persist(d);if(!skip)render();}
function setSetting(k,v){var s=Object.assign({},D.settings);s[k]=v;save(Object.assign({},D,{settings:s}));}
function setEntry(key,entry){var e=Object.assign({},D.entries);e[key]=entry;save(Object.assign({},D,{entries:e}));}
function patchEntry(key,field,val){var base=D.entries[key]||{type:'regular',shiftType:D.settings.currentRotation==='nights'?'night':'day'};var e=Object.assign({},base);e[field]=val;var ents=Object.assign({},D.entries);ents[key]=e;D=Object.assign({},D,{entries:ents});persist(D);}

var pad=function(n){return String(n).padStart(2,'0');};
var toKey=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var pKey=function(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var fTime=function(d){return pad(d.getHours())+':'+pad(d.getMinutes());};
var fDate=function(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});};
var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
function grid(y,m){var f=new Date(y,m,1),sd=f.getDay()-1;if(sd<0)sd=6;var ds=new Date(y,m+1,0).getDate(),c=[];for(var i=0;i<sd;i++)c.push(null);for(var d=1;d<=ds;d++)c.push(d);return c;}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d;}

function getRate(st,isOT){if(isOT)return st==='night'?D.settings.otNightRate:D.settings.otDayRate;return st==='night'?D.settings.nightRate:D.settings.dayRate;}
function getCurrentRate(){return D.settings.currentRotation==='nights'?D.settings.nightRate:D.settings.dayRate;}
function typeBg(t){return t==='overtime'?'#f97316':t==='holiday'?'#a78bfa':t==='halfholiday'?'#c084fc':t==='sickness'?'#38bdf8':'#22c55e';}
function typeLabel(t){return t==='halfholiday'?'half hol':t||'regular';}
function badge(t){return'<span class="badge" style="background:'+typeBg(t)+'">'+esc(typeLabel(t))+'</span>';}

function rawHours(ci,co){if(!ci||!co)return 0;var p1=ci.split(':').map(Number),p2=co.split(':').map(Number);var mins=(p2[0]*60+p2[1])-(p1[0]*60+p1[1]);if(mins<0)mins+=1440;return mins/60;}
function calcLate(clockIn,shiftStart){var ci=clockIn.split(':').map(Number),ss=shiftStart.split(':').map(Number);var diff=(ci[0]*60+ci[1])-(ss[0]*60+ss[1]);if(diff<-720)diff+=1440;return Math.max(0,diff);}
function calcEntry(e){
  if(!e)return{hours:0,rate:0,gross:0};
  var std=D.settings.paidHrsPerShift;
  if(e.type==='holiday'||e.type==='halfholiday'){var r=getRate(e.shiftType,false);return{hours:std,rate:r,gross:std*r};}
  if(e.type==='sickness'){var r=D.settings.sickRate||0;return{hours:std,rate:r,gross:std*r};}
  if(!e.clockIn||!e.clockOut)return{hours:0,rate:getRate(e.shiftType,e.type==='overtime'),gross:0};

function getActiveShift(){var now=new Date(),tk=toKey(now),te=D.entries[tk]||null;if(te&&te.clockIn&&!te.clockOut)return{key:tk,entry:te,isOvernight:false};var yd=yesterday(),yk=toKey(yd),ye=D.entries[yk]||null;if(ye&&ye.clockIn&&!ye.clockOut&&ye.shiftType==='night')return{key:yk,entry:ye,isOvernight:true};return null;}

function weekStart(d){var dt=new Date(d),day=dt.getDay();dt.setDate(dt.getDate()-(day===0?6:day-1));dt.setHours(0,0,0,0);return dt;}

function totals(){var wP=0,mP=0,yP=0,wH=0,mH=0,yH=0,now=new Date(),ws=weekStart(now),ms=new Date(now.getFullYear(),now.getMonth(),1),ys=taxYearStart();var keys=Object.keys(D.entries);for(var i=0;i<keys.length;i++){var k=keys[i],c=calcEntry(D.entries[k]);if(c.hours<=0)continue;var dt=pKey(k);if(dt>=ws){wP+=c.gross;wH+=c.hours;}if(dt>=ms){mP+=c.gross;mH+=c.hours;}if(dt>=ys){yP+=c.gross;yH+=c.hours;}}return{wP:wP,mP:mP,yP:yP,wH:wH,mH:mH,yH:yH};}
function payPeriod(){if(!D.settings.payPeriodStart)return'Not set';var wms=D.settings.payPeriodWeeks*7*86400000,ps=new Date(D.settings.payPeriodStart),now=new Date();while(ps.getTime()+wms<=now.getTime())ps=new Date(ps.getTime()+wms);var pe=new Date(ps.getTime()+wms-86400000),f=function(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});};return f(ps)+' – '+f(pe);}

function clockIn(){var now=new Date(),t=fTime(now),k=toKey(now);var existing=D.entries[k]||{};setEntry(k,Object.assign({},existing,{type:existing.type||'regular',shiftType:existing.shiftType||(D.settings.currentRotation==='nights'?'night':'day'),clockIn:t,clockOut:null}));toast('Clocked in at '+t);}
function clockOutFor(key){var now=new Date(),t=fTime(now);if(!D.entries[key]||!D.entries[key].clockIn)return;setEntry(key,Object.assign({},D.entries[key],{clockOut:t}));toast('Clocked out at '+t);}
function dayType(key,type){var base=D.entries[key]||{shiftType:D.settings.currentRotation==='nights'?'night':'day'};var e=Object.assign({},base,{type:type});if(type==='holiday'||type==='sickness'){delete e.clockIn;delete e.clockOut;}setEntry(key,e);var labels={holiday:'🌴 Holiday',halfholiday:'½ Holiday',overtime:'Marked as overtime',sickness:'🤒 Sickness',regular:'Set to regular'};toast(labels[type]||'Updated');}
function delEntry(key){var e=Object.assign({},D.entries);delete e[key];EDIT=null;SEL=null;CONFIRM=null;save(Object.assign({},D,{entries:e}));toast('Entry deleted');}
function toast(msg){var el=document.getElementById('toast-el');if(!el)return;el.innerHTML='<div class="toast">'+esc(msg)+'</div>';if(TOAST_T)clearTimeout(TOAST_T);TOAST_T=setTimeout(function(){if(el)el.innerHTML='';},2500);}

function schedRem(){if(REM_T1)clearTimeout(REM_T1);if(REM_T2)clearTimeout(REM_T2);if(!D.settings.notificationsEnabled)return;function sched(ts,id){if(!ts)return null;var p=ts.split(':').map(Number),tgt=new Date();tgt.setHours(p[0],p[1],0,0);var dl=tgt-Date.now();if(dl<0)dl+=86400000;return setTimeout(function(){if(Notification.permission!=='granted')return;var fresh=load(),k=toKey(new Date()),e=fresh.entries[k];if(e&&e.clockIn&&!e.clockOut)new Notification('⏰ Clock Out',{body:'Clocked in at '+e.clockIn,tag:'co-'+id});},dl);}REM_T1=sched(D.settings.reminderTime1,'1');REM_T2=sched(D.settings.reminderTime2,'2');}
function enableNotif(){if(!('Notification'in window)){toast('Not supported');return;}Notification.requestPermission().then(function(p){if(p==='granted'){setSetting('notificationsEnabled',true);toast('Notifications on ✓');schedRem();}else toast('Denied');});}

function genExport(){
  var t_=totals(),now=new Date(),fromDate=D.settings.exportFrom||'';
  var t='CLOCK TRACKER — DATA EXPORT\nGenerated: '+fDate(now)+' '+fTime(now)+'\n';
  t+='Day: £'+D.settings.dayRate+'/hr | Night: £'+D.settings.nightRate+'/hr | OT Day: £'+D.settings.otDayRate+'/hr | OT Night: £'+D.settings.otNightRate+'/hr\n';

function onClick(ev){
  var btn=ev.target.closest('[data-a]');if(!btn)return;
  var a=btn.dataset.a,k=btn.dataset.k,v=btn.dataset.v,tok=toKey(new Date());
  switch(a){
    case'cin':clockIn();break;
    case'cout':clockOutFor(k||tok);break;
    case'tog-ot':dayType(tok,D.entries[tok]&&D.entries[tok].type==='overtime'?'regular':'overtime');break;
    case'tog-hol':dayType(tok,D.entries[tok]&&D.entries[tok].type==='holiday'?'regular':'holiday');break;
    case'tog-halfhol':dayType(tok,D.entries[tok]&&D.entries[tok].type==='halfholiday'?'regular':'halfholiday');break;
    case'tog-sick':dayType(tok,D.entries[tok]&&D.entries[tok].type==='sickness'?'regular':'sickness');break;
    case'set-nights':setSetting('currentRotation','nights');break;
    case'set-days':setSetting('currentRotation','days');break;
    case'nav':VIEW=v;SEL=null;render();break;
    case'cprev':if(CAL_M===0){CAL_M=11;CAL_Y--;}else CAL_M--;render();break;
    case'cnext':if(CAL_M===11){CAL_M=0;CAL_Y++;}else CAL_M++;render();break;
    case'csel':SEL=SEL===k?null:k;render();break;
    case'edit':EDIT=k;render();break;
    case'cedit':EDIT=null;render();break;
    case'add-entry':patchEntry(k,'type','regular');EDIT=k;render();break;
    case'set-hol':dayType(k,'holiday');break;
    case'conf-del':CONFIRM={msg:'Delete this entry?',action:function(){delEntry(k);}};render();break;
    case'conf-reset':CONFIRM={msg:'Delete ALL data? This cannot be undone.',action:function(){try{localStorage.removeItem(SK);}catch(e){}D=load();CONFIRM=null;render();toast('All data cleared');}};render();break;
    case'cno':CONFIRM=null;render();break;
    case'cyes':if(CONFIRM)CONFIRM.action();break;
    case'export':doExport();break;
    case'cexp':EXPORT=null;render();break;
    case'copy-exp':var ta=document.getElementById('exp-ta');if(ta&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast('Copied ✓');});break;
    case'en-notif':enableNotif();break;
    case'dis-notif':setSetting('notificationsEnabled',false);break;
    case'etyp':if(EDIT){var base=D.entries[EDIT]||{};var ne=Object.assign({},base,{type:v});if(v==='holiday'||v==='sickness'){delete ne.clockIn;delete ne.clockOut;}var ents=Object.assign({},D.entries);ents[EDIT]=ne;D=Object.assign({},D,{entries:ents});persist(D);render();}break;
    case'esft':if(EDIT){patchEntry(EDIT,'shiftType',v);render();}break;
  }
}
function tick(){var now=new Date(),cl=document.getElementById('live-clock');if(cl)cl.innerHTML=pad(now.getHours())+':'+pad(now.getMinutes())+'<span style="font-size:22px;color:#6b7080">:'+pad(now.getSeconds())+'</span>';var active=getActiveShift();if(active&&active.entry.clockIn&&!active.entry.clockOut){var cp=active.entry.clockIn.split(':').map(Number),ciDate=pKey(active.key);ciDate.setHours(cp[0],cp[1],0,0);var diff=Math.floor((now.getTime()-ciDate.getTime())/60000);var elH=Math.floor(diff/60),elM=diff%60,rem=D.settings.shiftLengthHrs*60-diff;var rH=Math.floor(Math.max(0,rem)/60),rM=Math.floor(Math.max(0,rem)%60);var elEl=document.getElementById('el-val'),remEl=document.getElementById('rem-val');if(elEl)elEl.textContent=elH+'h '+pad(elM)+'m';if(remEl){remEl.textContent=rem>0?rH+'h '+pad(rM)+'m':'Done ✓';remEl.style.color=rem<=0?'#22c55e':'#f59e0b';}}}
render();setInterval(tick,1000);schedRem();
if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(e){console.log('SW:',e);});});
</script>
